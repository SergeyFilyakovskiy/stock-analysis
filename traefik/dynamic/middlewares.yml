http:
  middlewares:

    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s


    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "https://app.localhost"
          - "http://app.localhost"
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
        accessControlMaxAge: 86400

    basic-auth:
      basicAuth:
        users:
          # REQUIRED: Replace with a real htpasswd hash. Generate with: htpasswd -nB admin
          - "admin:$$2y$05$8EB70CNJpJLLvXCwjo3iMu.LIx1Als8GDMwnH.0GzaUgHXJpOK0U."

    jwt-auth:
      forwardAuth:
        address: "http://auth-service:8000/api/v1/verify"
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"
        trustForwardHeader: true
