name: stock-analysis


networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:


services:
# ── API GATEWAY ──────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certificates:ro
    networks:
      - public
      - internal


# ── FRONTEND ─────────────────────────────────────────────
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   networks:
  #     - public
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
  #     - "traefik.http.services.frontend.loadbalancer.server.port=3000"


# ── BACKEND SERVICES ─────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.auth.middlewares=rate-limit,cors-headers"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"


  market-service:
    build: ./services/market-service
    restart: unless-stopped
    env_file: .env
    expose:
      - "50051"
    depends_on:
      market-migrate:
        condition: service_completed_successfully
      timescaledb: { condition: service_healthy }
      redis:       { condition: service_healthy }
      rabbitmq:    { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/market`)"
      - "traefik.http.routers.market.middlewares=rate-limit,cors-headers,jwt-auth"
      - "traefik.http.services.market.loadbalancer.server.port=8000"

    # ─── Market Service migrate ──────────────────
  market-migrate:
    build: ./services/market-service
    command: alembic upgrade head
    env_file: .env
    restart: "no"
    depends_on:
      timescaledb: { condition: service_healthy }
      rabbitmq:    { condition: service_healthy }
      redis:       { condition: service_healthy }
    networks:
      - internal


  # ─── Market Service worker ───────────────────
  market-worker:
    build: ./services/market-service
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    restart: unless-stopped
    depends_on:
      market-migrate:
        condition: service_completed_successfully
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - internal


  # ─── Market Service beat ─────────────────────
  market-beat:
    build: ./services/market-service
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    restart: unless-stopped
    depends_on:
      market-worker:
        condition: service_started
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks:
      - internal


  technical-service:
    build: ./services/technical-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      market-service:
        condition: service_started
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.technical.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/technical`)"
      - "traefik.http.routers.technical.middlewares=rate-limit,cors-headers,jwt-auth"
      - "traefik.http.services.technical.loadbalancer.server.port=8000"


  fundamental-service:
    build: ./services/fundamental-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fundamental.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/fundamental`)"
      - "traefik.http.routers.fundamental.middlewares=rate-limit,cors-headers,jwt-auth"
      - "traefik.http.services.fundamental.loadbalancer.server.port=8000"


  portfolio-service:
    build: ./services/portfolio-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`api.localhost`) && PathPrefix(`/api/v1/portfolio`)"
      - "traefik.http.routers.portfolio.middlewares=rate-limit,cors-headers,jwt-auth"
      - "traefik.http.services.portfolio.loadbalancer.server.port=8000"


  notification-service:
    build: ./services/notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.rule=Host(`api.localhost`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.middlewares=cors-headers"
      - "traefik.http.services.ws.loadbalancer.server.port=8000"


# ── DATABASES ────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=timescaledb
        -c max_connections=200
        -c shared_buffers=512MB
        -c work_mem=16MB
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_prometheus && rabbitmq-server"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5


# ── OBSERVABILITY ────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - internal
    depends_on:
      redis: { condition: service_healthy }


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/postgres?sslmode=disable"
    networks:
      - internal
    depends_on:
      timescaledb: { condition: service_healthy }


  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=basic-auth"


  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://grafana.localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"